<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14b8a6"/>
      <stop offset="50%" stopColor="#0d9488"/>
      <stop offset="100%" stopColor="#0f766e"/>
    </linearGradient>

    <!-- Handle & Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="100%" stopColor="#f59e0b"/>
    </linearGradient>

    <!-- Cloche Highlight Gradient -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#f0fdfa"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with smooth shadow & border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- Subtle Inner Top Highlight -->
  <path d="M 6 18 C 6 10, 10 6, 18 6 L 46 6 C 54 6, 58 10, 58 18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Rising Steam Ribbons -->
  <path d="M 26 18 Q 24 13 27 9" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.5 1"/>
  <path d="M 32 17 Q 34 11 31 7" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 38 18 Q 40 13 37 9" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.5 1"/>

  <!-- Cloche Handle Knob -->
  <circle cx="32" cy="22" r="3.5" fill="url(#goldGrad)" stroke="#d97706" stroke-width="0.8"/>
  <rect x="30" y="25" width="4" height="3" rx="1" fill="#d97706"/>

  <!-- Cloche Dome -->
  <path d="M 14 43 C 14 26, 50 26, 50 43 Z" fill="url(#domeGrad)" stroke="#115e59" stroke-width="1.2"/>

  <!-- Cloche Rim Glow -->
  <path d="M 16 40 C 23 33, 41 33, 48 40" fill="none" stroke="#ccfbf1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Crossed Chef Utensils / Star Badge inside Dome -->
  <!-- Fork -->
  <path d="M 28 32 L 36 40 M 27 31 L 29 33 M 29 29 L 31 31" stroke="#0d9488" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Spoon -->
  <path d="M 36 32 L 28 40" stroke="#0d9488" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="36" cy="32" rx="2" ry="1.5" transform="rotate(-45 36 32)" fill="#0d9488"/>

  <!-- Glowing Rating Star Badge -->
  <polygon points="32,29 33.2,31.8 36.2,32.1 33.9,34.1 34.6,37 32,35.4 29.4,37 30.1,34.1 27.8,32.1 30.8,31.8" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>

  <!-- Serving Tray / Base Plate -->
  <rect x="10" y="44" width="44" height="4.5" rx="2.25" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
  <rect x="18" y="49" width="28" height="2" rx="1" fill="rgba(0,0,0,0.15)"/>
</svg>
